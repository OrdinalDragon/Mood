# ============================================================
# docker-compose.yml - MOOD Project
# ============================================================
# Servicios:
#   - mongo: MongoDB (base de datos)
#   - backend: FastAPI (API REST)
#   - frontend: React + Nginx (app web)
#   - nginx: Reverse proxy
#   - cloudflare: Tunnel para exponer a internet
#
# Uso:
#   docker-compose up -d --build
#
# URLs:
#   - Frontend: http://localhost
#   - Backend API: http://localhost:8000
#   - Swagger Docs: http://localhost:8000/docs

version: '3.8'

services:
  # ============================================================
  # MONGODB - Base de datos
  # ============================================================
  mongo:
    image: mongo:7
    container_name: mood_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mood_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mood_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mood_db}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mood_network

  # ============================================================
  # BACKEND - FastAPI
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mood_backend
    restart: always
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mood_user:mood_password@mongo:27017/mood_db?authSource=admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-mood_db}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SEND_EMAIL_REMINDERS: ${SEND_EMAIL_REMINDERS:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mood_network

  # ============================================================
  # FRONTEND - React + Nginx
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    container_name: mood_frontend
    restart: always
    environment:
      VITE_API_URL: /api
    expose:
      - "80"
    networks:
      - mood_network

  # ============================================================
  # NGINX - Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: mood_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - mood_network

  # ============================================================
  # CLOUDFLARE TUNNEL - Exponer a internet
  # ============================================================
  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: mood_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - mood_network
    depends_on:
      - nginx

# ============================================================
# VOLÚMENES - Datos persistentes
# ============================================================
volumes:
  mongodb_data:
    driver: local

# ============================================================
# REDES - Comunicación entre contenedores
# ============================================================
networks:
  mood_network:
    driver: bridge
