# ============================================================
# docker-compose.yml - MOOD Project
# ============================================================
# Servicios:
#   - mongo: MongoDB (base de datos)
#   - backend: FastAPI (API REST)
#   - frontend: React + Nginx (app web)
#   - nginx: Reverse proxy
#   - cloudflare: Tunnel para exponer a internet
#
# Uso:
#   docker-compose up -d --build
#
# URLs:
#   - Frontend: http://localhost
#   - Backend API / Swagger: solo accesible desde la red interna (vía nginx)

# ============================================================
# LOGGING - Rotación para no llenar el disco
# ============================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ============================================================
  # MONGODB - Base de datos
  # ============================================================
  mongo:
    image: mongo:7.0.45
    container_name: mood_mongo
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Definí MONGO_INITDB_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Definí MONGO_INITDB_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mood_db}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mood_network

  # ============================================================
  # BACKEND - FastAPI
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mood_backend
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_URI: ${MONGO_URI:?Definí MONGO_URI en .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-mood_db}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env (openssl rand -hex 32)}
      JWT_ISSUER: ${JWT_ISSUER:-mood}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mood-web}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      REFRESH_TOKEN_REMEMBER_DAYS: ${REFRESH_TOKEN_REMEMBER_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SEND_EMAIL_REMINDERS: ${SEND_EMAIL_REMINDERS:-1}
    volumes:
      - ./app:/app/app:ro
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mood_network

  # ============================================================
  # FRONTEND - React + Nginx
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    container_name: mood_frontend
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      VITE_API_URL: /api
    expose:
      - "80"
    networks:
      - mood_network

  # ============================================================
  # NGINX - Reverse Proxy
  # ============================================================
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: mood-nginx:latest
    container_name: mood_nginx
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      # Solo loopback: el acceso público entra exclusivamente por Cloudflare Tunnel.
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - mood_network

  # ============================================================
  # CLOUDFLARE TUNNEL - Exponer a internet
  # ============================================================
  cloudflare:
    image: cloudflare/cloudflared:2026.10.5
    container_name: mood_tunnel
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - mood_network
    depends_on:
      - nginx

# ============================================================
# VOLÚMENES - Datos persistentes
# ============================================================
volumes:
  mongodb_data:
    driver: local

# ============================================================
# REDES - Comunicación entre contenedores
# ============================================================
networks:
  mood_network:
    driver: bridge
