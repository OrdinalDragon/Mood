# Cabeceras de seguridad reutilizables.
# Se incluyen a nivel server y en cada location que define sus propios add_header
# (nginx no hereda add_header si el location ya tiene alguno).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.google.com https://www.gstatic.com https://ssl.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://apis.google.com https://www.google.com https://www.gstatic.com https://ssl.gstatic.com https://nominatim.openstreetmap.org https://cloudflareinsights.com; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp-endpoint" always;
# Trusted Types en modo observación: no bloquea, pero reporta para evaluar adopción.
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default; report-uri /api/csp-report" always;
