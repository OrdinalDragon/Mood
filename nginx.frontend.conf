server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html siempre fresco para no quedar con bundles viejos cacheados
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Assets con hash: cacheables de forma inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}