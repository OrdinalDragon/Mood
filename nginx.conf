# Nginx config - Proxy to frontend and backend
server {
    listen 80;
    server_name localhost;

    # Root -> frontend
    location / {
        proxy_pass http://mood_frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API -> backend
    location /api/ {
        proxy_pass http://mood_backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 200M;
    }

    # Uploaded images -> backend
    location /uploads/ {
        proxy_pass http://mood_backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
    }

    # Swagger docs -> backend
    location /docs/ {
        proxy_pass http://mood_backend:8000/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}