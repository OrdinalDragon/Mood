# Nginx config - Proxy to frontend and backend
server_tokens off;

# Rate limiting por IP real (detrás de Cloudflare usamos CF-Connecting-IP;
# si no viene, usamos la IP de la conexión).
map $http_cf_connecting_ip $limit_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Cloudflare termina TLS y envía X-Forwarded-Proto. Si no viene (acceso local
# directo), usamos el esquema real de la conexión.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $limit_client_ip zone=authlimit:10m rate=30r/m;
limit_req_zone $limit_client_ip zone=gemini_limit:10m rate=20r/m;
limit_req_zone $limit_client_ip zone=csp_limit:10m rate=30r/m;
limit_req_zone $limit_client_ip zone=apilimit:10m rate=100r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # El upload tiene un tope de 10MB en la app; dejamos margen para multipart.
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    # Swagger/OpenAPI deshabilitados en producción (no exponer el esquema)
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Root -> frontend
    location / {
        proxy_pass http://mood_frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $limit_client_ip;
        proxy_set_header X-Forwarded-For $limit_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Reportes CSP (sin auth, con límite propio para evitar floods)
    location = /api/csp-report {
        limit_req zone=csp_limit burst=20 nodelay;
        proxy_pass http://mood_backend:8000/csp-report;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $limit_client_ip;
        proxy_set_header X-Forwarded-For $limit_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gemini -> límite dedicado (evita abuso de costo por IP)
    location ^~ /api/gemini/ {
        limit_req zone=gemini_limit burst=5 nodelay;
        proxy_pass http://mood_backend:8000/gemini/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $limit_client_ip;
        proxy_set_header X-Forwarded-For $limit_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 40s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Auth -> límite estricto contra fuerza bruta
    location /api/auth/ {
        limit_req zone=authlimit burst=20 nodelay;
        proxy_pass http://mood_backend:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $limit_client_ip;
        proxy_set_header X-Forwarded-For $limit_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API -> backend
    location /api/ {
        limit_req zone=apilimit burst=50 nodelay;
        proxy_pass http://mood_backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $limit_client_ip;
        proxy_set_header X-Forwarded-For $limit_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Uploaded images -> backend
    location /uploads/ {
        proxy_pass http://mood_backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
